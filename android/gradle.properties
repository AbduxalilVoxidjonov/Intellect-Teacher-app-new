org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template.
# DIQQAT: false bo'lib QOLISHI kerak — firebase_core va boshqa plaginlar `kotlin-android`
# plaginini o'zi qo'llaydi, built-in Kotlin yoqilsa ular build'ni buzadi
# ("'kotlin-android' plugin requires one of the Android Gradle plugins").
# Shu sabab fayl tanlash uchun `file_picker` paketi ISHLATILMAYDI (u AGP 9 ostida
# built-in Kotlin borligini talab qiladi) — o'rniga MainActivity'dagi o'zimizning
# MethodChannel'imiz (ACTION_OPEN_DOCUMENT) ishlatiladi.
android.builtInKotlin=false
# Kotlin incremental cache (.tab) fayllari Windows'da bloklanib "Could not close incremental
# caches" xatosini berardi — incremental kompilyatsiya o'chirildi (build barqaror bo'lsin).
kotlin.incremental=false
org.gradle.caching=false
